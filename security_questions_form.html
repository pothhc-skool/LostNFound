<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Owner Verification</title>
</head>
<body>
    <h1>Verify Item Ownership</h1>

    <p>
        Answer the following security questions
        to help verify that you are the rightful
        owner of the lost item.
    </p>

    <form>
        <label for="description">
            Describe a unique feature of your item:
        </label>
        <br>
        <input type="text" id="description" name="description">
        <br><br>

        <label for="location">
            Where did you last see the item?
        </label>
        <br>
        <input type="text" id="location" name="location">
        <br><br>

        <label for="details">
            Provide any additional identifying details:
        </label>
        <br>
        <textarea id="details" name="details"></textarea>
        <br><br>

        <button type="button">Submit Verification</button>
    </form>

    <p>
        Placeholder for the ownership verification feature.
        Verification functionality will be implemented later.
    </p>
</body>
</html>
